name: moodspeak
description: A Flutter project for Mood-Based English Learning
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.5
  provider: ^6.0.5
  http: ^1.6.0
  permission_handler: ^11.3.1

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_storage: ^12.3.3

  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.2
  audioplayers: ^6.0.0
  image_picker: ^1.2.1
  shared_preferences: ^2.5.4

  flutter_localizations:
    sdk: flutter
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.11.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/data/
    - assets/sounds/
    - assets/images/

  fonts:
    - family: Cinzel
      fonts:
          - asset: assets/fonts/Cinzel-Regular.ttf
          - asset: assets/fonts/Cinzel-Bold.ttf
            weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"